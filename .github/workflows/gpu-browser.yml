name: GPU browser install

# A real install → start → use the link → stop → uninstall on fresh Linux
# and macOS runners (both have passwordless sudo). Only when gpu-browser/
# changes: it downloads Node.js and Chromium (~250 MB) each time.
on:
  push:
    branches: [master, main]
    paths: ['gpu-browser/**', '.github/workflows/gpu-browser.yml']
  pull_request:
    paths: ['gpu-browser/**', '.github/workflows/gpu-browser.yml']

concurrency:
  group: gpu-browser-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Shell scripts (shellcheck, dash, sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq shellcheck dash >/dev/null
      - run: shellcheck -s sh gpu-browser/install/install.sh gpu-browser/install/uninstall.sh gpu-browser/test/install-smoke.sh
      - run: shellcheck gpu-browser/scripts/vendor-sdk.sh
      - run: for f in gpu-browser/install/*.sh gpu-browser/test/install-smoke.sh; do dash -n "$f"; done

  install:
    name: Install, run, uninstall (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sh gpu-browser/test/install-smoke.sh
      - name: Diagnostics (on failure)
        if: failure() && runner.os == 'Linux'
        run: |
          echo "apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)"
          sudo dmesg | grep -iE 'apparmor="DENIED"|traps: chrome|segfault' | tail -20 || true
          # The same Chromium as the runner user: sandbox on, off, and with
          # the installer's AppArmor profile, each with Chromium's own log.
          export PLAYWRIGHT_BROWSERS_PATH=/tmp/diag-browsers
          npx -y playwright-core@1.64.0 install --no-shell chromium >/dev/null
          chrome=$(ls -d /tmp/diag-browsers/chromium-*/chrome-linux64/chrome)
          try() { echo "== $1"; shift; timeout 30 "$chrome" --headless --enable-logging=stderr --v=0 "$@" --dump-dom about:blank 2>&1 | grep -v 'dbus\|ssl_client' | tail -12; echo "exit=${PIPESTATUS[0]}"; }
          try "sandbox on"
          try "sandbox off" --no-sandbox
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile diag-chrome /tmp/diag-browsers/**/chrome flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/diag-chrome >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/diag-chrome
          try "sandbox on, AppArmor profile"
