<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Agent Socket — Activity</title>
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <header>
    <h1>Agent Socket — Activity</h1>
    <p class="muted small" id="note">Stored only on this computer for 7 days.</p>
  </header>

  <div class="toolbar">
    <input id="filter" type="search" placeholder="Filter by site, tool or text" autocomplete="off">
    <span class="muted small" id="count"></span>
    <button id="export" class="ghost small">Export JSON</button>
    <button id="delete-all" class="danger small">Delete all</button>
  </div>

  <main id="groups"></main>

  <script type="module" src="activity.js"></script>
</body>
</html>
