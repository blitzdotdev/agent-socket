name = "agent-socket-relay"
main = "src/worker.ts"
account_id = "d25a778b256fb6ef6eea554d77c40f27"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Production routes. agentsocket.dev is the canonical brand domain.
# aisocket.dev is kept as an alias (was the temporary URL during early v0).
# Both point at this same Worker.
routes = [
  { pattern = "agentsocket.dev",     custom_domain = true },
  { pattern = "www.agentsocket.dev", custom_domain = true },
  { pattern = "aisocket.dev",        custom_domain = true },
  { pattern = "www.aisocket.dev",    custom_domain = true },
]

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayServer"

[[migrations]]
tag = "v1"
new_classes = ["RelayServer"]

[vars]
TOKEN_PREFIX = "as"
MAX_SYNC_TOOL_MS = "30000"
HEARTBEAT_INTERVAL_MS = "25000"
HEARTBEAT_TIMEOUT_MS = "50000"
# DEBUG is intentionally not set in default vars — production must NOT have it.
# For local dev, set it in `.dev.vars` (gitignored) which wrangler picks up
# only when running `wrangler dev`, never on `wrangler deploy`.
